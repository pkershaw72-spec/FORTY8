[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forty8"
version = "0.1.0"
description = "Agentic catastrophe-modelling pipeline: broker submission to priced loss results"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "pypdf>=4.0",
    "h3>=4.0",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
forty8 = "forty8.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forty8 = ["schema/*.toml", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
