# Forty8 configuration. Every threshold and every connector choice lives here.
# Secrets are never stored in this file: connectors name the environment
# variables that hold their endpoint and API key.

[thresholds]
geocode_min_tiv_street_level = 0.80   # step 6 and step 8: share of TIV at street level or better
slip_min_confidence = 0.85            # step 2b: overall slip confidence = minimum term confidence
ml_min_confidence = 0.75              # step 5: below this the value goes to the review queue
header_min_confidence = 0.80          # step 3: minimum confidence to accept an LLM header mapping
yoy_tiv_change_flag = 0.25            # step 7: flag a location whose TIV moved more than this vs prior year

[geocoding]
street_level_or_better = ["rooftop", "street"]
h3_resolution = 8
web_max_distance_km = 100.0           # a web-search location must be this close to the stated city

[audit]                               # step 8 data quality tests
year_built_min = 1700
year_built_max_offset_years = 1       # latest acceptable year built = current year + this
tiv_reconcile_tolerance = 0.001       # relative difference allowed between pipeline TIV and SoV totals
[audit.max_storeys_by_construction]   # OED construction code -> highest plausible number of storeys
5050 = 6
5100 = 12
5201 = 3

[model]
max_retries = 2
poll_interval_seconds = 0.0
timeout_seconds = 30.0

[metrics]
target_minutes = 48                   # straight-through target the run report compares against

[storage]
db_path = "var/forty8.db"
mock_data_dir = "var/mock_data"       # prior-year and survey files written by the synthetic generator

[schema]
target = "oed"

[fx]
base = "USD"
[fx.rates_to_base]                    # static rates for the proof of concept
USD = 1.0
EUR = 1.08
GBP = 1.27
MXN = 0.055
JPY = 0.0066

# impl = "mock" everywhere for v1. A real connector is added by registering an
# implementation under a new impl name and changing the line here.
[connectors.moodys_geocoder]
impl = "mock"
endpoint_env = "MOODYS_GEOCODER_URL"
api_key_env = "MOODYS_API_KEY"

[connectors.bing_geocoder]
impl = "mock"
endpoint_env = "BING_MAPS_URL"
api_key_env = "BING_MAPS_KEY"

[connectors.web_search]
impl = "mock"
api_key_env = "WEB_SEARCH_KEY"

[connectors.building_data]
impl = "mock"
endpoint_env = "BUILDING_DATA_URL"
api_key_env = "BUILDING_DATA_KEY"

[connectors.nathan]
impl = "mock"
endpoint_env = "NATHAN_URL"
api_key_env = "NATHAN_KEY"

[connectors.athenium]
impl = "mock"
endpoint_env = "ATHENIUM_URL"
api_key_env = "ATHENIUM_KEY"

[connectors.h3]
impl = "h3"                           # the real open-source library

[connectors.survey_store]
impl = "mock"

[connectors.prior_year_store]
impl = "mock"

[connectors.cat_model]
impl = "mock"
endpoint_env = "MOODYS_MODEL_URL"
api_key_env = "MOODYS_API_KEY"
[connectors.cat_model.options]
fail_first_n_jobs = 0                 # mock only: force job failures to exercise retry
polls_until_complete = 2

[connectors.pricing_tool]
impl = "mock"
endpoint_env = "PRICING_TOOL_URL"
api_key_env = "PRICING_TOOL_KEY"
[connectors.pricing_tool.options]
reject = false                        # mock only: reject every submission
reject_first_n = 0                    # mock only: reject the first n submissions, then accept

[connectors.llm]
impl = "mock"
api_key_env = "ANTHROPIC_API_KEY"
[connectors.llm.options]
model = "mock-llm"
